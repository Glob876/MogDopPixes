name: Checks
on:
  push:
    branches: [dev]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: free -h
      - run: cargo install wasm-pack --locked --version 0.15.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test --locked
      - run: xvfb-run -a node tests/electron-check.mjs
